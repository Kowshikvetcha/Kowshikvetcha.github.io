<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kowshik Vetcha — Machine Learning Engineer</title>
  <meta name="description" content="Machine Learning Engineer building production ML and GenAI systems: demand forecasting, fraud detection, RAG and end-to-end MLOps." />
  <meta property="og:title" content="Kowshik Vetcha — Machine Learning Engineer" />
  <meta property="og:description" content="Production ML & GenAI systems: forecasting, fraud detection, RAG and MLOps." />
  <meta property="og:url" content="https://kowshikvetcha.github.io/" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0f17'/><text x='16' y='23' font-family='Arial' font-weight='800' font-size='20' text-anchor='middle' fill='%235eead4'>K</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply saved theme before paint to avoid a flash
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="#top" class="logo" id="logo"></a>
      <nav class="nav-links" id="nav-links">
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#credentials">Credentials</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
          <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn menu-btn" id="menu-toggle" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero container">
      <p class="badge" id="badge"><span class="dot"></span>Open to opportunities</p>
      <h1>Hi, I'm <span class="accent" id="hero-name"></span>.</h1>
      <h2 class="hero-role" id="hero-role"></h2>
      <p class="hero-tagline" id="hero-tagline"></p>
      <div class="hero-cta">
        <a href="#projects" class="btn btn-primary">View my work</a>
        <a href="#" class="btn btn-ghost" id="resume-link" download="Vetcha_Kowshik_Resume.pdf">Download Resume</a>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section id="about" class="section container reveal">
      <h3 class="section-title"><span class="num">01.</span> About me</h3>
      <div class="about" id="about-text"></div>
    </section>

    <section id="skills" class="section container reveal">
      <h3 class="section-title"><span class="num">02.</span> Skills</h3>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <section id="experience" class="section container reveal">
      <h3 class="section-title"><span class="num">03.</span> Experience</h3>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section id="projects" class="section container reveal">
      <h3 class="section-title"><span class="num">04.</span> Projects</h3>
      <div class="projects-grid" id="projects-grid"></div>
      <p class="more-link"><a class="btn btn-ghost" id="github-all" target="_blank" rel="noopener">See all on GitHub →</a></p>
    </section>

    <section id="credentials" class="section container reveal">
      <h3 class="section-title"><span class="num">05.</span> Certifications &amp; Education</h3>
      <div class="creds-grid" id="creds-grid"></div>
    </section>

    <section id="contact" class="section container contact reveal">
      <h3 class="section-title center"><span class="num">06.</span> Get in touch</h3>
      <p class="contact-blurb" id="contact-blurb"></p>

      <div class="contact-grid">
        <form class="card contact-form" id="contact-form" novalidate>
          <div class="field-row">
            <label>Name<input name="name" type="text" autocomplete="name" required maxlength="100" /></label>
            <label>Email<input name="email" type="email" autocomplete="email" required maxlength="150" /></label>
          </div>
          <label>Subject<input name="subject" type="text" maxlength="150" placeholder="Job opportunity, collaboration, question…" /></label>
          <label>Message<textarea name="message" rows="5" required maxlength="4000"></textarea></label>
          <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <button type="submit" class="btn btn-primary" id="contact-submit">Send message</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>

        <aside class="contact-side">
          <div class="card contact-item">
            <span class="contact-label">Email</span>
            <div class="email-row">
              <a id="contact-email"></a>
              <button type="button" class="icon-btn" id="copy-email" aria-label="Copy email address">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
              </button>
            </div>
          </div>
          <div class="card contact-item">
            <span class="contact-label">Elsewhere</span>
            <div class="social" id="social"></div>
          </div>
          <div class="card contact-item">
            <span class="contact-label">Based in</span>
            <span id="contact-location"></span>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="footer container">
    <p id="footer-text"></p>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
